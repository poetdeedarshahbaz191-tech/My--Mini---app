<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Publish New Poem</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

h1{
    color:#8b0000;
}

input,textarea{
    width:90%;
    padding:10px;
    margin-top:8px;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:10px 25px;
    font-size:18px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>🌹 Publish New Poem 🌹</h1>


<div id="loginBox">

<h2>Admin Login</h2>

<input type="email" id="email" placeholder="Email">

<br><br>

<input type="password" id="password" placeholder="Password">

<br>

<button id="loginBtn">Login</button>

</div>



<div id="publishBox" style="display:none;">

<label>Poem Title</label>

<input type="text" id="title" placeholder="Enter title">


<label>Your Poem</label>

<textarea id="poem" rows="12" placeholder="Write your poem here..."></textarea>

<br>

<button id="publishBtn">Publish</button>
<button id="logoutBtn">Logout</button>
    
</div>


</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {

apiKey: "AIzaSyAEtsOoIe3tll0_hvovC42j9ujcb8Wavu4",

authDomain: "poet--deedar---shahbaz.firebaseapp.com",

projectId: "poet--deedar---shahbaz",

storageBucket: "poet--deedar---shahbaz.firebasestorage.app",

messagingSenderId: "411582745091",

appId: "1:411582745091:web:96413eef58092e77911c36",

measurementId: "G-E0V5QH9D98"

};


const app = initializeApp(firebaseConfig);
    
const auth = getAuth(app);
auth.useDeviceLanguage();
const db = getFirestore(app);


console.log("Current user:", auth.currentUser);
onAuthStateChanged(auth, (user) => {

if (user) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("publishBox").style.display = "block";

    } else {

        document.getElementById("loginBox").style.display = "block";
        document.getElementById("publishBox").style.display = "none";

    }

});

    // LOGIN

document.getElementById("loginBtn").addEventListener("click", async()=>{

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

try{

const userCredential = await signInWithEmailAndPassword(auth, email, password);

if (userCredential.user.email === "poetshahbaz_quambrani@gmail.com") {

alert("Logged in successfully!");

} else {

alert("Not authorized");

await signOut(auth);

}

} catch (error) {
    console.log(error);
    alert(error.code + "\n" + error.message);
}

           
document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    alert("Logged out successfully");
});

</script>


</body>
</html>
