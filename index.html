Gy<!DOCTYPE html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Poet Deedar Shahbaz</title>

<style>
.admin-btn{
    display:none;
}
    

    body{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Georgia, serif;
    background:linear-gradient(135deg,#ffe6f0,#fff7cc,#e8f5ff);
}
.poem-card{
    width:100%;
    max-width:900px;
    box-sizing:border-box;
    margin:25px auto;padding:20px;overflow:hidden;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,.2);
}
    
.poem-card:nth-child(4n+1){
    background:#fff0f5;
}

.poem-card:nth-child(4n+2){
    background:#fff8dc;
}

.poem-card:nth-child(4n+3){
    background:#e8f8ff;
}

.poem-card:nth-child(4n+4){
    background:#f0fff0;
}

.poem-title{
    text-align:center;
    color:#8B0000;
    font-size:28px;
    margin-bottom:20px;
}

.poem-text{
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
    direction:rtl;
    text-align:right;
    line-height:2;
    font-size:20px;
    width:100%;
}
.poem-text pre{
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    margin:0;
    font-family:Georgia, serif;
}
button{
    margin-top:20px;
    padding:10px 18px;
    border:none;
    border-radius:10px;
    background:#8B0000;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#b22222;
}
.container{
    width:100%;
    max-width:900px;
    margin:auto;
    box-sizing:border-box;
}

h1{
    text-align:center;
    color:#8B0000;
    font-size:38px;
}
</style>

</head>

<body>

<div class="container">

<h1>🌹 Poet Deedar Shahbaz 🌹</h1>
<br>

<div style="text-align:center; margin-bottom:20px;">

<a href="about.html"><button>ℹ️ About</button></a>

<a href="contact.html"><button>📩 Contact</button></a>

<a href="privacy.html"><button>🔒 Privacy Policy</button></a>

<a href="terms.html"><button>📜 Terms</button></a>

</div>

<div id="publishArea" style="display:none;">
    <a href="publish.html">
        <button>🌹 Publish New Poem 🌹</button>
    </a>
</div>
<br><br>
<div style="text-align:center; margin:20px;">
    
        <input
type="text"
id="searchInput"
placeholder="🔍 Search poems..."
onkeyup="window.searchPoems()">
      
        
    
</div>
    
    <div id="poetry"></div>






<script type="module"> 

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

   import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  deleteDoc,
  doc,
  addDoc,
  updateDoc,
  increment,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAEtsOoIe3tll0_hvovC42j9ujcb8Wavu4",
  authDomain: "poet--deedar---shahbaz.firebaseapp.com",
  projectId: "poet--deedar---shahbaz",
  storageBucket: "poet--deedar---shahbaz.firebasestorage.app",
  messagingSenderId: "411582745091",
  appId: "1:411582745091:web:96413eef58092e77911c36",
  measurementId: "G-E0V5QH9D98"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const poetryBox = document.getElementById("poetry");


   async function loadPoems(){

poetryBox.innerHTML = "";

let querySnapshot;

try {
    
querySnapshot = await getDocs(collection(db, "poems"));
    console.log("Poems found:", querySnapshot.size);

    alert("Poems found: " + querySnapshot.size);
} catch (error) {
    console.error(error);
    alert("Error loading poems: " + error.message);
    return;
}

querySnapshot.forEach((poemDoc) => {
const data = poemDoc.data();

poetryBox.innerHTML += `
<div class="poem-card">

<h2 class="poem-title">${data.title}</h2>

<div class="poem-text">
<pre>${data.poem}</pre>
</div>

<p>❤️ Likes: ${data.likes || 0}</p>

<button onclick="likePoem('${poemDoc.id}')">
    ❤️ Like
</button>

<button onclick="sharePoem('${poemDoc.id}')">
    📤 Share
</button>


<button onclick="commentPoem('${poemDoc.id}')">
    💬 Comment
</button>

<button class="admin-btn" style="display:none;" onclick="editPoem('${poemDoc.id}')">
    ✏️ Edit
</button>

<button class="admin-btn" style="display:none;" onclick="deletePoem('${poemDoc.id}')">
    🗑 Delete
</button>



</div>
`;

});

}

 globalThis.deletePoem = async function(id){

    if(!confirm("Delete this poem?")) return;

    try{
        await deleteDoc(doc(db, "poems", id));

        alert("Poem deleted successfully.");

        location.reload();

    }catch(error){
        alert(error.message);
    }

};
    globalThis.editPoem = function(id){
    window.location.href = "edit.html?id=" + id;
};
    
        
    globalThis.sharePoem = async function(id) {
    const url = window.location.href;

    if (navigator.share) {
        await navigator.share({
            title: "Poet Deedar Shahbaz",
            text: "Read this beautiful poem",
            url: url
        });
    } else {
        navigator.clipboard.writeText(url);
        alert("Link copied!");
    }
};
    
globalThis.commentPoem = function(id) {
    window.location.href = "comment.html?id=" + id;
};
   globalThis.postComment = async function(id) {
    const text = document.getElementById("commentText-" + id).value.trim();

    if (!text) {
        alert("Please write a comment.");
        return;
    }

    try {
        await addDoc(collection(db, "Comments"), {
            poemId: id,
            text: text,
            time: serverTimestamp()
        });

        alert("Comment posted successfully!");

        document.getElementById("commentText-" + id).value = "";

    } catch (error) {
        alert(error.message);
    }
};
    globalThis.likePoem = async function(id) {
    try {
        const poemRef = doc(db, "poems", id);

        await updateDoc(poemRef, {
            likes: increment(1)
        });

        alert("❤️ Thanks for liking this poem!");
        location.reload();

    } catch (error) {
        alert(error.message);
    }
};
    

onAuthStateChanged(auth, async (user) => {

    if (user && user.email === "poetshahbaz_quambrani@gmail.com") {
        document.getElementById("publishArea").style.display = "block";
    } else {
        document.getElementById("publishArea").style.display = "none";
    }

    await loadPoems();

    if (user && user.email === "poetshahbaz_quambrani@gmail.com") {
        document.querySelectorAll(".admin-btn").forEach(btn => {
            btn.style.display = "inline-block";
        });
    }

});
           
    window.searchPoems = function() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let poems = document.getElementsByClassName("poem-card");

    for (let i = 0; i < poems.length; i++) {
        let text = poems[i].innerText.toLowerCase();

        if (text.includes(input)) {
            poems[i].style.display = "block";
        } else {
            poems[i].style.display = "none";
        }
    }
}

    
</script>

</body>
</html>
