<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Poet Deedar Shahbaz</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    font-family:Georgia, serif;
    background:linear-gradient(135deg,#ffe6f0,#fff7cc,#e8f5ff);
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:0 10px;
}

h1{
    text-align:center;
    color:#8B0000;
    font-size:38px;
    margin-top:25px;
}

.poem-card{
    width:100%;
    max-width:900px;
    margin:25px auto;
    padding:20px;
    overflow:hidden;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.poem-card:nth-child(4n+1){
    background:#fff0f5;
}

.poem-card:nth-child(4n+2){
    background:#fff8dc;
}

.poem-card:nth-child(4n+3){
    background:#e8f8ff;
}

.poem-card:nth-child(4n+4){
    background:#f0fff0;
}

.poem-title{
    text-align:center;
    color:#8B0000;
    font-size:28px;
    margin-bottom:20px;
}

.poem-text{
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
    direction:rtl;
    text-align:right;
    line-height:2;
    font-size:20px;
    width:100%;
}

.poem-text pre{
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
    margin:0;
    font-family:Georgia, serif;
}

button{
    margin-top:20px;
    margin-right:5px;
    padding:10px 18px;
    border:none;
    border-radius:10px;
    background:#8B0000;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#b22222;
}

.nav-buttons{
    text-align:center;
    margin-bottom:20px;
}

.search-box{
    text-align:center;
    margin:20px;
}

.search-box input{
    width:90%;
    max-width:600px;
    padding:12px;
    border:2px solid #8B0000;
    border-radius:10px;
    font-size:17px;
}

#loading{
    text-align:center;
    color:#8B0000;
    font-size:20px;
    margin:30px;
}

#noPoems{
    display:none;
    text-align:center;
    color:#8B0000;
    font-size:20px;
    margin:30px;
}

.admin-btn{
    display:none;
}

footer{
    text-align:center;
    padding:20px;
    margin-top:40px;
    background:#8B0000;
    color:white;
}

footer a{
    color:white;
    text-decoration:none;
}

</style>

</head>


<body>

<div class="container">

<h1>🌹 Poet Deedar Shahbaz 🌹</h1>


<div class="nav-buttons">

<a href="about.html">
<button>ℹ️ About</button>
</a>

<a href="contact.html">
<button>📩 Contact</button>
</a>

<a href="privacy.html">
<button>🔒 Privacy Policy</button>
</a>

<a href="terms.html">
<button>📜 Terms</button>
</a>

<a href="learn-with-deedar/">
<button>📚 Learn with Deedar</button>
</a>

</div>


<div id="publishArea" style="display:none; text-align:center;">

<a href="publish.html">
<button>🌹 Publish New Poem 🌹</button>
</a>

</div>


<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="🔍 Search poems..."
onkeyup="window.searchPoems()">

</div>


<div id="loading">
Loading poems...
</div>


<div id="noPoems">
No poems found.
</div>


<div id="poetry"></div>


</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy,
    deleteDoc,
    doc,
    addDoc,
    updateDoc,
    increment,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
    "AIzaSyAEtsOoIe3tll0_hvovC42j9ujcb8Wavu4",

    authDomain:
    "poet--deedar---shahbaz.firebaseapp.com",

    projectId:
    "poet--deedar---shahbaz",

    storageBucket:
    "poet--deedar---shahbaz.firebasestorage.app",

    messagingSenderId:
    "411582745091",

    appId:
    "1:411582745091:web:96413eef58092e77911c36",

    measurementId:
    "G-E0V5QH9D98"

};


/* INITIALIZE FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const poetryBox =
document.getElementById("poetry");

const loading =
document.getElementById("loading");

const noPoems =
document.getElementById("noPoems");


/* LOAD POEMS */

async function loadPoems(){

    poetryBox.innerHTML = "";

    loading.style.display = "block";

    noPoems.style.display = "none";


    try{

        /*
        IMPORTANT:

        publish.html saves:

        timestamp: Date.now()

        Therefore we sort using
        "timestamp", NOT "Date".
        */

        const q = query(
            collection(db, "poems"),
            orderBy("timestamp", "desc")
        );


        const querySnapshot =
        await getDocs(q);


        console.log(
            "Poems found:",
            querySnapshot.size
        );


        loading.style.display = "none";


        if(querySnapshot.empty){

            noPoems.style.display = "block";

            return;
        }


        querySnapshot.forEach((poemDoc)=>{

            const data =
            poemDoc.data();


            const title =
            escapeHTML(data.title || "No Title");


            const poem =
            escapeHTML(data.poem || "No Poem");


            const likes =
            data.likes || 0;


            poetryBox.innerHTML += `

            <div class="poem-card">

                <h2 class="poem-title">
                    ${title}
                </h2>


                <div class="poem-text">

                    <pre>${poem}</pre>

                </div>


                <p>
                    ❤️ Likes: ${likes}
                </p>


                <button
                onclick="likePoem('${poemDoc.id}')">

                    ❤️ Like

                </button>


                <button
                onclick="sharePoem('${poemDoc.id}')">

                    📤 Share

                </button>


                <button
                onclick="commentPoem('${poemDoc.id}')">

                    💬 Comment

                </button>


                <button
                class="admin-btn"
                onclick="editPoem('${poemDoc.id}')">

                    ✏️ Edit

                </button>


                <button
                class="admin-btn"
                onclick="deletePoem('${poemDoc.id}')">

                    🗑 Delete

                </button>


            </div>

            `;

        });


    }catch(error){

        loading.style.display = "none";

        console.error(
            "Error loading poems:",
            error
        );


        poetryBox.innerHTML = `

        <div style="
        text-align:center;
        color:#8B0000;
        padding:30px;
        ">

        <h2>Unable to load poems</h2>

        <p>
        ${escapeHTML(error.message)}
        </p>

        </div>

        `;

    }

}


/* SECURITY - ESCAPE TEXT */

function escapeHTML(text){

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* DELETE POEM */

globalThis.deletePoem =
async function(id){

    if(!confirm(
        "Delete this poem?"
    )){
        return;
    }


    try{

        await deleteDoc(
            doc(db,"poems",id)
        );


        alert(
            "Poem deleted successfully."
        );


        await loadPoems();


    }catch(error){

        alert(
            error.message
        );

    }

};


/* EDIT POEM */

globalThis.editPoem =
function(id){

    window.location.href =
    "edit.html?id=" + id;

};


/* SHARE POEM */

globalThis.sharePoem =
async function(id){

    const url =
    window.location.href;


    if(navigator.share){

        try{

            await navigator.share({

                title:
                "Poet Deedar Shahbaz",

                text:
                "Read this beautiful poem",

                url:url

            });

        }catch(error){

            console.log(
                "Share cancelled."
            );

        }

    }else{

        try{

            await navigator.clipboard.writeText(
                url
            );

            alert(
                "Link copied!"
            );

        }catch(error){

            alert(
                "Unable to copy link."
            );

        }

    }

};


/* COMMENT */

globalThis.commentPoem =
function(id){

    window.location.href =
    "comment.html?id=" + id;

};


/* POST COMMENT */

globalThis.postComment =
async function(id){

    const element =
    document.getElementById(
        "commentText-" + id
    );


    if(!element){

        return;

    }


    const text =
    element.value.trim();


    if(!text){

        alert(
            "Please write a comment."
        );

        return;

    }


    try{

        await addDoc(
            collection(db,"Comments"),
            {

                poemId:id,

                text:text,

                time:
                serverTimestamp()

            }
        );


        alert(
            "Comment posted successfully!"
        );


        element.value = "";


    }catch(error){

        alert(
            error.message
        );

    }

};


/* LIKE POEM */

globalThis.likePoem =
async function(id){

    try{

        const poemRef =
        doc(db,"poems",id);


        await updateDoc(
            poemRef,
            {

                likes:
                increment(1)

            }
        );


        alert(
            "❤️ Thanks for liking this poem!"
        );


        await loadPoems();


    }catch(error){

        alert(
            error.message
        );

    }

};


/* SEARCH POEMS */

window.searchPoems =
function(){

    const input =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();


    const poems =
    document
    .getElementsByClassName(
        "poem-card"
    );


    let visibleCount = 0;


    for(
        let i=0;
        i<poems.length;
        i++
    ){

        const text =
        poems[i]
        .innerText
        .toLowerCase();


        if(
            text.includes(input)
        ){

            poems[i].style.display =
            "block";

            visibleCount++;

        }else{

            poems[i].style.display =
            "none";

        }

    }


    if(
        poems.length > 0 &&
        visibleCount === 0
    ){

        noPoems.style.display =
        "block";

    }else{

        noPoems.style.display =
        "none";

    }

};


/* AUTHENTICATION */

onAuthStateChanged(
    auth,
    async(user)=>{


        if(
            user &&
            user.email &&
            user.email
            .toLowerCase()
            .trim() ===
            "poetshahbaz_quambrani@gmail.com"
        ){

            document
            .getElementById(
                "publishArea"
            )
            .style.display =
            "block";


        }else{

            document
            .getElementById(
                "publishArea"
            )
            .style.display =
            "none";

        }


        /*
        IMPORTANT:

        Poems are loaded for EVERYONE,
        including logged-out visitors.
        */

        await loadPoems();


        /*
        Show admin buttons only
        to the authorized account.
        */

        if(
            user &&
            user.email &&
            user.email
            .toLowerCase()
            .trim() ===
            "poetshahbaz_quambrani@gmail.com"
        ){

            document
            .querySelectorAll(
                ".admin-btn"
            )
            .forEach(
                btn => {

                    btn.style.display =
                    "inline-block";

                }
            );

        }

    }

);

</script>

</body>
