<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comments</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}

h2{
    text-align:center;
}

textarea{
    width:100%;
    height:120px;
    padding:10px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    margin-top:10px;
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

#commentsList{
    margin-top:20px;
}

.comment{
    background:white;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
}
</style>

</head>
<body>

<h2>Comments</h2>

<textarea id="commentText" placeholder="Write your comment..."></textarea>

<br>

<button onclick="addComment()">Post Comment</button>

<div id="commentsList"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAEtsOoIe3tll0_hvovC42j9ujcb8Wavu4",
  authDomain: "poet--deedar---shahbaz.firebaseapp.com",
  projectId: "poet--deedar---shahbaz",
  storageBucket: "poet--deedar---shahbaz.firebasestorage.app",
  messagingSenderId: "411582745091",
  appId: "1:411582745091:web:96413eef58092e77911c36"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadComments() {
  const list = document.getElementById("commentsList");
  list.innerHTML = "";

  const snapshot = await getDocs(collection(db, "comments"));

  snapshot.forEach((commentDoc) => {
    const data = commentDoc.data();

    const div = document.createElement("div");
    div.className = "comment";

    div.innerHTML = `
      <p>${data.text}</p>
      <button data-id="${commentDoc.id}">Delete</button>
    `;

    div.querySelector("button").onclick = async () => {
      await deleteDoc(doc(db, "comments", commentDoc.id));
      loadComments();
    };

    list.appendChild(div);
  });
}

window.addComment = async function () {
  const text = document.getElementById("commentText").value.trim();

  if (!text) {
    alert("Please write your comment.");
    return;
  }

  try {
    await addDoc(collection(db, "comments"), {
      text: text,
      time: serverTimestamp()
    });

    document.getElementById("commentText").value = "";
    loadComments();
    alert("Comment posted!");
  } catch (error) {
    alert(error.message);
  }
};

loadComments();
</script>

</body>
</html>
