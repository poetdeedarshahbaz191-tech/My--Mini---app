
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Poem</title>
</head>

<body>

<h1>✏️ Edit Poem</h1>

<label>Poem Title</label><br>
<input type="text" id="title" style="width:90%;"><br><br>

<label>Your Poem</label><br>
<textarea id="poem" rows="12" style="width:90%;"></textarea><br><br>

<button id="updateBtn">Update Poem</button>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {
  apiKey: "AIzaSyAEtsOoIe3tll0_hvovC42j9ujcb8Wavu4",
  authDomain: "poet--deedar---shahbaz.firebaseapp.com",
  projectId: "poet--deedar---shahbaz",
  storageBucket: "poet--deedar---shahbaz.firebasestorage.app",
  messagingSenderId: "411582745091",
  appId: "1:411582745091:web:96413eef58092e77911c36",
  measurementId: "G-E0V5QH9D98"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
  
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const poemRef = doc(db, "poems", id);
const poemSnap = await getDoc(poemRef);

if (poemSnap.exists()) {
    const data = poemSnap.data();
    document.getElementById("title").value = data.title;
    document.getElementById("poem").value = data.poem;
}

document.getElementById("updateBtn").addEventListener("click", async () => {
    await updateDoc(poemRef, {
        title: document.getElementById("title").value,
        poem: document.getElementById("poem").value
    });

    alert("Poem updated successfully!");
    window.location.href = "index.html";
});
</script>
</body>
</html>
