
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
    
.box{
    width:320px;
    background:white;
    padding:25px;

    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}

#message{
    text-align:center;
    margin-top:15px;
    color:red;
}
</style>

</head>

<body>

<div class="box">
    <h2>Admin Login</h2>

    <input type="email" id="email" placeholder="Enter Email">
    <input type="password" id="password" placeholder="Enter Password">

    <button id="loginBtn">Login</button>

    <p id="message"></p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyAEtsOoIe3tll0_hvovC42j9ujcb8Wavu4",
  authDomain: "poet--deedar---shahbaz.firebaseapp.com",
  projectId: "poet--deedar---shahbaz",
  storageBucket: "poet--deedar---shahbaz.firebasestorage.app",
  messagingSenderId: "411582745091",
  appId: "1:411582745091:web:96413eef58092e77911c36",
  measurementId: "G-E0V5QH9D98"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
    
document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");
alert("1");

try {
    alert("2");
    alert("3");

console.log("Before login");
await signInWithEmailAndPassword(auth, email, password);
console.log("After login");
    message.style.color = "green";
    message.textContent = "Login successful!";

    window.location.href = "publish.html";

    } catch (error) {
    console.log(error);
    alert(error.code);
    alert(error.message);
}
});
</script>

</body>
</html>
